# Requirement -> implementation -> test -> result traceability (D-045).
# 'requirement' is a paraphrase; 'source' + 'pages' point to the passage; 'query' is used to retrieve it
# from the RAG index as evidence. 'tests' are pytest node ids; 'metric' is a dotted path into
# metrics.json. 'assessment' is the developer's own judgment (Met / Partially met), kept separate from
# the automated test status.

- id: R01
  source: SR2602a1.pdf
  pages: [6]
  requirement: Model testing should include out-of-sample and out-of-time testing.
  query: testing out-of-sample and out-of-time testing comparison of alternative assumptions
  implementation: Vintage-based OOT split (D-008, D-012); hazard and LGD OOT backtests (D-021, D-027)
  tests: [tests/test_pd.py::test_gini_and_ks_match_references, tests/test_panel.py::test_no_truncated_labels_near_cutoff]
  metric: phase2.scorecard.discrimination.2.gini
  assessment: Met
- id: R02
  source: SR2602a1.pdf
  pages: [6]
  requirement: Testing should include a critical assessment of data quality, relevance, and inputs.
  query: critical assessment of data quality relevance and inputs
  implementation: Strict schema casting, duplicate/gap/ID checks, loss identity reconciliation (D-002, D-011)
  tests: [tests/test_schema_and_metrics.py::test_raw_files_match_layout, tests/test_panel.py::test_loss_identity_on_real_reo_row]
  metric: phase1.totals.loss_identity_pass
  assessment: Met

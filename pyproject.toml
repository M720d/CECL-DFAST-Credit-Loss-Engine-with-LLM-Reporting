[project]
name = "cecl-dfast-engine"
version = "0.1.0"
description = "CECL allowance and DFAST stress-loss engine on Freddie Mac loan-level data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=1.0",
    "pyarrow>=15",
    "pyyaml>=6",
    "requests>=2.31",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "optbinning>=1.0.0",
    "statsmodels>=0.15.0",
    "lightgbm>=4.7.0",
    "shap>=0.54.1",
    "scikit-learn>=1.9.1",
    "faiss-cpu>=1.16.0",
    "pypdf>=7.0.1",
    "beautifulsoup4>=4.15.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cecl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore:.*:Warning:optbinning.*"]
